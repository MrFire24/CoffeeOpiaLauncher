appId: 'lastshot'
productName: 'LastShot'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Dedicated installer artwork (distinct from the app/launcher icon).
  installerIcon: 'build/installerIcon.ico'
  uninstallerIcon: 'build/installerIcon.ico'
  installerHeaderIcon: 'build/installerIcon.ico'

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  # Declare microphone usage so in-game voice chat (Simple Voice Chat) works.
  # Without NSMicrophoneUsageDescription in the launcher's Info.plist, macOS blocks
  # the microphone for the child Java process and the mod reports "your launcher
  # does not support microphone permissions on macOS".
  extendInfo:
    NSMicrophoneUsageDescription: 'LastShot needs microphone access so in-game voice chat (Simple Voice Chat) can work.'
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'